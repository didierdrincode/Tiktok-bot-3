name: tiktok-drip

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      runtime:
        default: "15"

concurrency:
  group: tiktok-drip
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/cache@v4
        with:
          path: |
            state.json
            free-proxy-list.txt
            working-proxies.txt
            proxy-geo.json
          key: botdata-${{ github.run_id }}
          restore-keys: botdata-

      - run: pip install -r requirements.txt

      - name: Continuous loop
        run: |
          RUNTIME="${{ github.event.inputs.runtime || 15 }}"
          while true; do
            echo "[*] assuring proxies..."
            python ensure_proxies.py --min 50 --max-wait 10 || true
            echo "[*] running slice (${RUNTIME}m) - probing hosts+proxies inside..."
            python tiktok_bot.py --runtime "$RUNTIME" --residential-only --debug || true
            sleep 5
          done